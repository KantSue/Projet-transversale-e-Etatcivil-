{%load static%}


<div class="max-w-4xl mx-auto mt-10 p-6 bg-white shadow-lg rounded-xl">

    <h2 class="text-2xl font-bold text-center mb-6 text-blue-600">
        Demande d'acte de naissance
    </h2>

    <form method="POST">
        {% csrf_token %}

        <!-- 👶 ENFANT -->
        <div class="mb-6">
            <h3 class="text-lg font-semibold text-gray-700 mb-2">Informations de l'enfant</h3>
            <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                {{ enfant_form.as_p }}
            </div>
        </div>

        <!-- 👨 PÈRE -->
        <div class="mb-6">
            <h3 class="text-lg font-semibold text-gray-700 mb-2">Informations du père</h3>
            <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                {{ pere_form.as_p }}
            </div>
        </div>

        <!-- 👩 MÈRE -->
        <div class="mb-6">
            <h3 class="text-lg font-semibold text-gray-700 mb-2">Informations de la mère</h3>
            <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                {{ mere_form.as_p }}
            </div>
        </div>

        <!-- 📄 ACTE -->
        <div class="mb-6">
            <h3 class="text-lg font-semibold text-gray-700 mb-2">Informations de l'acte</h3>
            <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                {{ ActeNaissance_form.as_p }}
            </div>
        </div>

        <!-- 🔘 BOUTON -->
        <div class="text-center">
            <button type="submit"
                class="bg-blue-600 text-white px-6 py-2 rounded-lg hover:bg-blue-700 transition">
                Soumettre la demande
            </button>
        </div>

    </form>

</div>
